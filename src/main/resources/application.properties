spring.application.name=trading-journal-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:trading_journal}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:trading_journal}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:local-development-only}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=52MB
management.endpoints.web.exposure.include=health
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
security.jwt.secret-base64=${JWT_SECRET_BASE64:}
security.jwt.issuer=${JWT_ISSUER:trading-journal-api}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT10M}
security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P30D}
security.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:true}
security.password-reset.resend-api-key=${RESEND_API_KEY:}
security.password-reset.sender-email=${RESEND_FROM_EMAIL:}
security.password-reset.frontend-url=${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
security.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:PT30M}
