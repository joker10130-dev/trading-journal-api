spring.application.name=trading-journal-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:trading_journal}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:trading_journal}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:local-development-only}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
management.endpoints.web.exposure.include=health
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
