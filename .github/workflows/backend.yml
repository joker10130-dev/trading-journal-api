name: Backend

on:
  push:
    paths:
      - ".github/workflows/backend.yml"
      - ".mvn/**"
      - "compose.yaml"
      - "mvnw"
      - "pom.xml"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/backend.yml"
      - ".mvn/**"
      - "compose.yaml"
      - "mvnw"
      - "pom.xml"
      - "src/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: bash ./mvnw --batch-mode --no-transfer-progress verify
